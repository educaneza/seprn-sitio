<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check-in — Conferencia IA 2026 | SEPRN · OTDE</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0C1A2E;
      --teal:    #1D9E75;
      --teal-dk: #167a5a;
      --surface: #F9F8F5;
      --text:    #1a1a2e;
      --muted:   #6b7280;
      --border:  #d1d5db;
    }

    body {
      background: var(--bg);
      color: var(--surface);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── HEADER ── */
    .hdr {
      background: var(--bg);
      border-bottom: 2px solid var(--teal);
      padding: .85rem 1.5rem;
      display: flex;
      align-items: center;
      gap: .75rem;
    }
    .hdr .brand  { font-size: 1rem; font-weight: 700; letter-spacing: .05em; }
    .hdr .brand span { color: var(--teal); }
    .hdr .tag {
      margin-left: auto;
      font-size: .75rem;
      color: var(--teal);
      border: 1px solid var(--teal);
      padding: .2rem .6rem;
      border-radius: 999px;
      letter-spacing: .06em;
    }

    /* ── SCREENS ── */
    .screen {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
    }
    .screen.hidden { display: none; }

    /* ── CARD ── */
    .card {
      background: var(--surface);
      color: var(--text);
      border-radius: 14px;
      padding: 2rem;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 6px 32px rgba(0,0,0,.4);
    }
    .card h2 {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--bg);
      margin-bottom: .4rem;
    }
    .card .sub {
      font-size: .82rem;
      color: var(--muted);
      margin-bottom: 1.5rem;
    }

    /* ── INPUTS ── */
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: .75rem 1rem;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      color: var(--text);
      background: #fff;
      transition: border-color .15s;
      -webkit-appearance: none;
    }
    input:focus {
      outline: none;
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(29,158,117,.15);
    }
    input#folio-input {
      font-family: 'Courier New', monospace;
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: .05em;
      text-transform: uppercase;
      text-align: center;
    }

    /* ── BOTONES ── */
    .btn {
      width: 100%;
      padding: .8rem;
      background: var(--teal);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background .15s;
      margin-top: .75rem;
    }
    .btn:hover:not(:disabled) { background: var(--teal-dk); }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn-outline {
      background: transparent;
      border: 1.5px solid var(--teal);
      color: var(--teal);
    }
    .btn-outline:hover { background: #e6f7f2; }

    /* ── RESULTADO ── */
    .result-card {
      border-radius: 10px;
      padding: 1.25rem;
      margin-top: 1.25rem;
      display: none;
    }
    .result-card.ok         { background: #d1fae5; border: 1.5px solid #6ee7b7; }
    .result-card.ya         { background: #fef9c3; border: 1.5px solid #fde047; }
    .result-card.espera     { background: #ffedd5; border: 1.5px solid #fdba74; }
    .result-card.no-enc     { background: #fee2e2; border: 1.5px solid #fca5a5; }
    .result-card.error      { background: #fee2e2; border: 1.5px solid #fca5a5; }

    .result-card .r-status {
      font-size: .75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .1em;
      margin-bottom: .6rem;
    }
    .result-card.ok     .r-status { color: #065f46; }
    .result-card.ya     .r-status { color: #713f12; }
    .result-card.espera .r-status { color: #7c2d12; }
    .result-card.no-enc .r-status { color: #7f1d1d; }
    .result-card.error  .r-status { color: #7f1d1d; }

    .result-card .r-nombre {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--bg);
      margin-bottom: .25rem;
    }
    .result-card .r-detail {
      font-size: .85rem;
      color: #374151;
    }
    .result-card .r-folio {
      font-family: monospace;
      font-size: .9rem;
      font-weight: 600;
      margin-top: .4rem;
      color: var(--bg);
    }
    .result-card .r-hora {
      font-size: .78rem;
      color: var(--muted);
      margin-top: .3rem;
    }

    /* ── SPINNER ── */
    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2.5px solid rgba(255,255,255,.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      vertical-align: middle;
      margin-right: .35rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── CONTADOR ── */
    .counter {
      text-align: center;
      margin-top: 1.25rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border);
      font-size: .85rem;
      color: var(--muted);
    }
    .counter strong { font-size: 1.4rem; color: var(--teal); display: block; }

    .pin-hint { font-size: .75rem; color: var(--muted); margin-top: .4rem; text-align: center; }

    /* ── CÁMARA QR ── */
    .btn-cam {
      width: 100%;
      padding: .7rem;
      background: transparent;
      border: 1.5px solid var(--teal);
      color: var(--teal);
      border-radius: 8px;
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: .5rem;
      transition: background .15s;
    }
    .btn-cam:hover { background: #e6f7f2; }
    .btn-cam.active { background: #fee2e2; border-color: #dc2626; color: #dc2626; }

    #cam-wrapper {
      margin-top: .75rem;
      border-radius: 10px;
      overflow: hidden;
      display: none;
      border: 2px solid var(--teal);
    }
    #cam-wrapper.visible { display: block; }
    #qr-reader { width: 100%; }
    #qr-reader video { border-radius: 8px; }
    /* ocultar branding de html5-qrcode */
    #qr-reader__status_span,
    #qr-reader__dashboard_section_swaplink,
    #qr-reader img { display: none !important; }
    #qr-reader__dashboard { padding: .5rem !important; background: #f9fafb; }
  </style>
</head>
<body>

<header class="hdr">
  <div class="brand">SEPRN <span>·</span> OTDE</div>
  <span class="tag">CHECK-IN · IA 2026</span>
</header>

<!-- ── PANTALLA 1: PIN ── -->
<div class="screen" id="screen-pin">
  <div class="card">
    <h2>Acceso operador</h2>
    <p class="sub">Conferencia Inteligencia Artificial — 17 jun 2026</p>
    <input type="password" id="pin-input" placeholder="PIN de acceso"
           maxlength="10" autocomplete="off">
    <p class="pin-hint" id="pin-error" style="color:#dc2626;display:none;">PIN incorrecto. Intenta de nuevo.</p>
    <button class="btn" id="btn-pin">Acceder</button>
  </div>
</div>

<!-- ── PANTALLA 2: SCANNER ── -->
<div class="screen hidden" id="screen-scanner">
  <div class="card">
    <h2>Registro de asistencia</h2>
    <p class="sub">Escanea el QR o escribe el folio manualmente</p>

    <input type="text" id="folio-input" placeholder="CONF-III-01"
           autocomplete="off" autocorrect="off" spellcheck="false">

    <button class="btn" id="btn-verificar">Verificar y registrar</button>

    <button class="btn-cam" id="btn-cam">
      &#9654; Escanear QR con cámara
    </button>

    <!-- Visor de cámara -->
    <div id="cam-wrapper">
      <div id="qr-reader"></div>
    </div>

    <button class="btn btn-outline" id="btn-limpiar" style="margin-top:.5rem;display:none;">
      Registrar otro
    </button>

    <!-- Resultado -->
    <div class="result-card" id="result-card">
      <div class="r-status" id="r-status"></div>
      <div class="r-nombre" id="r-nombre"></div>
      <div class="r-detail" id="r-detail"></div>
      <div class="r-folio" id="r-folio"></div>
      <div class="r-hora"  id="r-hora"></div>
    </div>

    <!-- Contador de asistencias -->
    <div class="counter" id="counter" style="display:none;">
      <strong id="count-num">0</strong>
      asistencias registradas hoy
    </div>
  </div>
</div>

<script>
// ── Reemplaza con la URL real del Apps Script ──
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxbqOCDTLncOjRr8G69tRQTNOz6jqRBu8ByAyi2zUQL-_mnFbrfd6FeFoMXpVuVI6T3/exec';

// PIN local — debe coincidir con CHECKIN_PIN en conferencia-ia.gs
const LOCAL_PIN = '2026IAOTDE';

let sessionPin = sessionStorage.getItem('checkin_pin') || '';
let asistenciasHoy = 0;

// Restaurar sesión si el PIN ya estaba guardado en esta pestaña
if (sessionPin === LOCAL_PIN) iniciarScanner();

// ── PIN: validación local, sin necesidad de internet ──
document.getElementById('pin-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('btn-pin').click();
});

document.getElementById('btn-pin').addEventListener('click', () => {
  const pin = document.getElementById('pin-input').value.trim();
  if (!pin) return;

  if (pin === LOCAL_PIN) {
    sessionStorage.setItem('checkin_pin', pin);
    sessionPin = pin;
    iniciarScanner();
  } else {
    document.getElementById('pin-error').textContent = 'PIN incorrecto. Intenta de nuevo.';
    document.getElementById('pin-error').style.display = 'block';
    document.getElementById('pin-input').value = '';
    document.getElementById('pin-input').focus();
  }
});

function iniciarScanner() {
  document.getElementById('screen-pin').classList.add('hidden');
  document.getElementById('screen-scanner').classList.remove('hidden');
  setTimeout(() => document.getElementById('folio-input').focus(), 100);
}

// ── SCANNER ──
// Los lectores QR envían el texto + Enter automáticamente
document.getElementById('folio-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('btn-verificar').click();
});

document.getElementById('btn-verificar').addEventListener('click', async () => {
  const folio = document.getElementById('folio-input').value.trim().toUpperCase();
  if (!folio) return;

  const btn = document.getElementById('btn-verificar');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Verificando…';

  const card      = document.getElementById('result-card');
  card.className  = 'result-card';
  card.style.display = 'none';

  try {
    const r = await fetch(`${APPS_SCRIPT_URL}?action=checkin&folio=${encodeURIComponent(folio)}&pin=${encodeURIComponent(sessionPin)}`);
    const d = await r.json();
    mostrarResultado(d);
  } catch {
    mostrarResultado({ status: 'error', mensaje: 'Error de conexión. Intenta de nuevo.' });
  }

  btn.disabled = false;
  btn.textContent = 'Verificar y registrar';
  document.getElementById('btn-limpiar').style.display = 'block';
});

function mostrarResultado(d) {
  const card = document.getElementById('result-card');
  card.style.display = 'block';

  const cfg = {
    ok:          { cls: 'ok',     icono: '✅', label: 'Asistencia registrada' },
    ya_registrado:{ cls: 'ya',    icono: '🔁', label: 'Ya estaba registrado' },
    lista_espera: { cls: 'espera',icono: '⏳', label: 'Lista de espera — sin lugar confirmado' },
    no_encontrado:{ cls: 'no-enc',icono: '❌', label: 'Folio no encontrado' },
    error:        { cls: 'error', icono: '⚠️', label: d.mensaje || 'Error' },
  };
  const c = cfg[d.status] || cfg.error;

  card.className = `result-card ${c.cls}`;
  document.getElementById('r-status').textContent = `${c.icono} ${c.label}`;
  document.getElementById('r-nombre').textContent = d.nombre || '';
  document.getElementById('r-detail').textContent = d.funcion
    ? `${d.funcion} · ${d.escuela || ''} · Sector ${d.sector || ''}`
    : (d.mensaje || '');
  document.getElementById('r-folio').textContent  = d.folio  ? `Folio: ${d.folio}` : '';
  document.getElementById('r-hora').textContent   = d.hora   ? `Hora de entrada: ${formatHora(d.hora)}` : '';

  if (d.status === 'ok') {
    asistenciasHoy++;
    document.getElementById('count-num').textContent = asistenciasHoy;
    document.getElementById('counter').style.display = 'block';
  }
}

// Convierte "1899-12-30T21:36:36.000Z" → "21:36" si Sheets entregó un Date serializado
function formatHora(h) {
  const m = String(h).match(/T(\d{2}:\d{2})/);
  return m ? m[1] : String(h);
}

document.getElementById('btn-limpiar').addEventListener('click', () => {
  document.getElementById('folio-input').value = '';
  document.getElementById('result-card').style.display = 'none';
  document.getElementById('btn-limpiar').style.display = 'none';
  detenerCamara();
  document.getElementById('folio-input').focus();
});

// ── CÁMARA QR ──
let html5QrScanner = null;
let camaraActiva = false;

document.getElementById('btn-cam').addEventListener('click', () => {
  camaraActiva ? detenerCamara() : iniciarCamara();
});

function iniciarCamara() {
  if (!html5QrScanner) {
    html5QrScanner = new Html5Qrcode('qr-reader');
  }
  document.getElementById('cam-wrapper').classList.add('visible');
  document.getElementById('btn-cam').textContent = '&#9632; Detener cámara';
  document.getElementById('btn-cam').classList.add('active');
  camaraActiva = true;

  html5QrScanner.start(
    { facingMode: 'environment' },
    { fps: 12, qrbox: { width: 240, height: 240 } },
    (texto) => {
      document.getElementById('folio-input').value = texto.trim().toUpperCase();
      detenerCamara();
      document.getElementById('btn-verificar').click();
    },
    () => {}
  ).catch(() => {
    detenerCamara();
    alert('No se pudo acceder a la cámara. Verifica que el navegador tenga permiso.');
  });
}

function detenerCamara() {
  if (html5QrScanner && camaraActiva) {
    html5QrScanner.stop().catch(() => {});
  }
  document.getElementById('cam-wrapper').classList.remove('visible');
  const btn = document.getElementById('btn-cam');
  btn.innerHTML = '&#9654; Escanear QR con cámara';
  btn.classList.remove('active');
  camaraActiva = false;
}
</script>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</body>
</html>
